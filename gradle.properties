# Disables the Gradle daemon. On Windows, a lingering daemon JVM can
# keep file handles open on the build/ directory between runs, causing
# "Unable to delete directory" errors on the next build.
org.gradle.daemon=false

# Disables Kotlin's incremental compilation cache. This is a known,
# well-documented Windows issue: the incremental cache directory
# (build/kotlin/compileKotlin/cacheable/caches-jvm) intermittently
# fails to be deleted between builds ("Unable to delete directory"),
# because Windows briefly locks files that a background process
# (antivirus real-time scanning, search indexer, etc.) is touching.
# Turning incremental compilation off makes each build a bit slower
# (full recompile every time instead of only changed files), but
# avoids this class of error entirely.
kotlin.incremental=false

# Disables Gradle's build cache. The "cacheable" directory that keeps
# failing to delete is used to support Gradle's build cache feature;
# turning the cache off entirely removes the need for that directory.
org.gradle.caching=false